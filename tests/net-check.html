<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>멀티플레이 연결 점검</title>
<style>
  body { margin: 0; padding: 16px 16px 60px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.lead { color: #8b949e; margin: 0 0 14px; font-size: 12px; }
  #out { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .ok { color: #56d364; }
  .bad { color: #ff7b72; }
  .wait { color: #d29922; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; margin-bottom: 14px; }
</style>
</head>
<body>
<h1>멀티플레이 연결 점검</h1>
<p class="lead">게임 멀티플레이가 쓰는 WSS 중계 서버에 브라우저가 실제로 닿는지, 방을 열고 메시지가 오가는지 확인합니다. 결과는 아래에 순서대로 표시됩니다.</p>
<button id="run" type="button">다시 점검</button>
<div id="out"></div>
<script>
/* 아주 작은 MQTT 3.1.1 클라이언트 (WebSocket 전용, QoS 0) */
function encStr(s) {
  var out = [s.length >> 8, s.length & 255];
  for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i) & 255);
  return out;
}
function encLen(n) {
  var out = [];
  do {
    var d = n % 128;
    n = Math.floor(n / 128);
    if (n > 0) d |= 0x80;
    out.push(d);
  } while (n > 0);
  return out;
}
function bytes(arr) { return new Uint8Array(arr); }

window.MiniMqtt = function (url) {
  this.url = url;
  this.ws = null;
  this.buf = new Uint8Array(0);
  this.pid = 1;
  this.onmessage = null;
};

MiniMqtt.prototype.connect = function (clientId, timeoutMs) {
  var self = this;
  return new Promise(function (res, rej) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; rej(new Error('timeout connect')); } }, timeoutMs || 8000);
    var ws = new WebSocket(self.url, ['mqtt']);
    self.ws = ws;
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      var body = encStr('MQTT').concat([0x04, 0x02, 0x00, 0x3c]).concat(encStr(clientId));
      ws.send(bytes([0x10].concat(encLen(body.length)).concat(body)));
    };
    ws.onerror = function (e) {
      if (!done) { done = true; clearTimeout(timer); rej(new Error('ws error')); }
    };
    ws.onclose = function () {
      if (!done) { done = true; clearTimeout(timer); rej(new Error('ws closed')); }
    };
    ws.onmessage = function (ev) {
      var chunk = new Uint8Array(ev.data);
      var all = new Uint8Array(self.buf.length + chunk.length);
      all.set(self.buf); all.set(chunk, self.buf.length);
      self.buf = all;
      self.parse(function (type, payload) {
        if (type === 0x20) {
          if (!done) { done = true; clearTimeout(timer); res(true); }
        }
      });
    };
  });
};

MiniMqtt.prototype.parse = function (onPacket) {
  var b = this.buf;
  var i = 0;
  while (i < b.length) {
    var start = i;
    var type = b[i] >> 4;
    i++;
    var mult = 1, len = 0, d;
    do {
      if (i >= b.length) { this.buf = b.slice(start); return; }
      d = b[i++];
      len += (d & 127) * mult;
      mult *= 128;
    } while (d & 128);
    if (i + len > b.length) { this.buf = b.slice(start); return; }
    var payload = b.slice(i, i + len);
    i += len;
    onPacket(type, payload);
    if (this.onmessage) this.onmessage(type, payload);
  }
  this.buf = b.slice(i);
};

MiniMqtt.prototype.subscribe = function (topic) {
  var id = this.pid++;
  var body = [id >> 8, id & 255].concat(encStr(topic)).concat([0x00]);
  this.ws.send(bytes([0x82].concat(encLen(body.length)).concat(body)));
  return id;
};

MiniMqtt.prototype.publish = function (topic, text) {
  var bytesArr = [];
  for (var i = 0; i < text.length; i++) bytesArr.push(text.charCodeAt(i) & 255);
  var body = encStr(topic).concat(bytesArr);
  this.ws.send(bytes([0x30].concat(encLen(body.length)).concat(body)));
};

MiniMqtt.prototype.ping = function () { if (this.ws) this.ws.send(bytes([0xc0, 0x00])); };
MiniMqtt.prototype.close = function () { if (this.ws) this.ws.close(); };

MiniMqtt.prototype.decodePublish = function (payload) {
  var tl = (payload[0] << 8) | payload[1];
  var topic = '';
  for (var i = 0; i < tl; i++) topic += String.fromCharCode(payload[2 + i]);
  var body = '';
  for (var j = 2 + tl; j < payload.length; j++) body += String.fromCharCode(payload[j]);
  return { topic: topic, body: body };
};

(function () {
  var BROKERS = [
    { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' },
    { name: 'Eclipse', url: 'wss://mqtt.eclipseprojects.io:443/mqtt' },
  ];
  var out = document.getElementById('out');
  var lines = [];
  function log(text) {
    lines.push(text);
    out.innerHTML = lines.map(function (l) {
      var c = /^\[OK\]/.test(l) ? 'ok' : /^\[FAIL\]/.test(l) ? 'bad' : /^\[WAIT\]/.test(l) ? 'wait' : '';
      return '<span class="' + c + '">' + l.replace(/[<>&]/g, function (s) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[s]; }) + '</span>';
    }).join('\n');
    document.title = 'net-check ' + lines.length;
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function checkBroker(b) {
    var t0 = performance.now();
    var cid = 'rpgchk' + Math.random().toString(36).slice(2, 9);
    var client = new window.MiniMqtt(b.url);
    var got = null;
    var topic = 'rpgprobe/' + Math.random().toString(36).slice(2, 8);
    try {
      await client.connect(cid, 9000);
      log('[OK] ' + b.name + ' 접속 (' + Math.round(performance.now() - t0) + 'ms)');
    } catch (e) {
      log('[FAIL] ' + b.name + ' 접속: ' + e.message);
      client.close();
      return false;
    }
    client.onmessage = function (type, payload) {
      if (type === 3) {
        var m = client.decodePublish(payload);
        if (m.topic === topic) got = m.body;
      }
    };
    client.subscribe(topic);
    await wait(600);
    client.publish(topic, 'hello-' + Date.now());
    for (var i = 0; i < 40; i++) { if (got) break; await wait(100); }
    if (got) log('[OK] ' + b.name + ' 메시지 왕복: ' + got);
    else log('[FAIL] ' + b.name + ' 메시지 왕복 실패 (구독/발행)');
    client.close();
    return !!got;
  }

  async function run() {
    lines = [];
    out.innerHTML = '';
    log('[WAIT] 점검 시작 ' + new Date().toISOString());
    for (var i = 0; i < BROKERS.length; i++) await checkBroker(BROKERS[i]);
    log('[WAIT] 점검 끝');
  }
  document.getElementById('run').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
